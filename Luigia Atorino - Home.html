document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg ro caldo.\n   Newsreader (titoli) + Nunito Sans (testo). Niente rosso. */\n\n:root {\n  --ink: #232720;\n  --cream: #fffcf6;\n  --panna: #f6f1e6;\n\n  --color-bg: #f6f1e6;\n  --color-surface: #fffcf6;\n  --color-text: #232720;\n  --color-accent: #5e9b58;\n  --color-accent-2: #c9a227;\n  --color-divider: rgba(35, 39, 32, 0.14);\n\n  --color-neutral-100: #fffcf6;\n  --color-neutral-200: #f6f1e6;\n  --color-neutral-300: #ebe4d4;\n  --color-neutral-400: #d6cdb9;\n  --color-neutral-500: #a89f8b;\n  --color-neutral-600: #7c7565;\n  --color-neutral-700: #5d5749;\n  --color-neutral-800: #403c32;\n  --color-neutral-900: #232720;\n\n  --color-accent-100: #eef4ea;\n  --color-accent-200: #dbe8d3;\n  --color-accent-300: #bcd5b1;\n  --color-accent-400: #92bb88;\n  --color-accent-500: #5e9b58;\n  --color-accent-600: #4a8146;\n  --color-accent-700: #37613a;\n  --color-accent-800: #2a4a2d;\n  --color-accent-900: #1d3320;\n\n  --color-accent-2-100: #fbf5e4;\n  --color-accent-2-200: #f4e8c6;\n  --color-accent-2-300: #e9d69c;\n  --color-accent-2-400: #d9bb5f;\n  --color-accent-2-500: #c9a227;\n  --color-accent-2-600: #a8861d;\n  --color-accent-2-700: #806616;\n  --color-accent-2-800: #5d4a10;\n  --color-accent-2-900: #3d300a;\n\n  --font-heading: \"Newsreader\", Georgia, \"Times New Roman\", serif;\n  --font-heading-weight: 400;\n  --font-body: \"Nunito Sans\", system-ui, sans-serif;\n\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n\n  --shadow-sm: 0 1px 2px rgba(35, 39, 32, 0.05);\n  --shadow-md: 0 2px 4px rgba(35, 39, 32, 0.05), 0 10px 24px -12px rgba(35, 39, 32, 0.18);\n  --shadow-lg: 0 4px 8px rgba(35, 39, 32, 0.05), 0 22px 48px -20px rgba(35, 39, 32, 0.24);\n\n  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);\n}\n\nbody {\n  font-family: var(--font-body);\n  font-weight: 400;\n  color: var(--ink);\n  line-height: 1.7;\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-heading);\n  font-weight: 400;\n  letter-spacing: -0.005em;\n  line-height: 1.14;\n}\nh3, h4 { font-weight: 500; }\n\na {\n  color: var(--color-accent-700);\n  text-decoration: none;\n  background-image: linear-gradient(var(--color-accent-400), var(--color-accent-400));\n  background-repeat: no-repeat;\n  background-position: 0 100%;\n  background-size: 100% 1px;\n  padding-bottom: 1px;\n  transition: color 0.25s var(--ease), background-size 0.3s var(--ease);\n}\na:hover { color: var(--color-accent-800); background-size: 100% 2px; }\n::selection { background: var(--color-accent-200); color: var(--ink); }\n:focus-visible { outline: 2px solid var(--color-accent-600); outline-offset: 3px; border-radius: 2px; }\n\n/* — animazioni d'ingresso (attive solo se motion.js è caricato) — */\n@keyframes reveal-up {\n  from { opacity: 0; transform: translateY(18px); }\n  to { opacity: 1; transform: none; }\n}\nhtml.js-motion [data-reveal]:not(.is-in),\nhtml.js-motion [data-stagger]:not(.is-in) > * { opacity: 0; }\nhtml.js-motion [data-reveal].is-in,\nhtml.js-motion [data-stagger].is-in > * { animation: reveal-up 0.8s var(--ease) both; }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }\n}\n\n/* — barra di navigazione — */\n.nav {\n  border-bottom: 1px solid var(--color-divider);\n  align-items: center;\n  background: color-mix(in srgb, var(--panna) 88%, transparent);\n  backdrop-filter: saturate(1.4) blur(10px);\n  transition: box-shadow 0.35s var(--ease), padding 0.35s var(--ease), background 0.35s var(--ease);\n}\n.nav.is-scrolled {\n  box-shadow: 0 1px 0 var(--color-divider), 0 14px 28px -24px rgba(35, 39, 32, 0.5);\n  padding-top: 10px;\n  padding-bottom: 10px;\n}\n.nav-brand { font-family: var(--font-heading); }\n.brand-logo {\n  display: block;\n  height: 54px;\n  width: auto;\n  transition: height 0.35s var(--ease);\n}\n.nav.is-scrolled .brand-logo { height: 42px; }\n.nav a:not(.btn):not(.nav-brand) {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: 15px;\n  letter-spacing: 0.005em;\n  color: var(--color-neutral-800);\n  background: none;\n  padding: 2px 0 4px;\n  position: relative;\n  transition: color 0.25s var(--ease);\n}\n.nav a:not(.btn):not(.nav-brand)::after {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  height: 1.5px;\n  background: var(--color-accent-600);\n  transform: scaleX(0);\n  transform-origin: left;\n  transition: transform 0.32s var(--ease);\n}\n.nav a:not(.btn):not(.nav-brand):hover { color: var(--color-accent-700); }\n.nav a:not(.btn):not(.nav-brand):hover::after { transform: scaleX(1); }\n.nav a[aria-current=\"page\"]:not(.btn) { color: var(--color-accent-700); }\n.nav a[aria-current=\"page\"]:not(.btn)::after { transform: scaleX(1); }\n\n/* — filetto sottile — */\n.hr {\n  height: 1px;\n  border: 0;\n  background: var(--color-divider);\n}\n\n/* — pulsanti — */\n.btn {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: 15px;\n  letter-spacing: 0.01em;\n  padding: 12px 24px;\n  min-height: 48px;\n  border: 1px solid transparent;\n  border-radius: 999px;\n  background: var(--cream);\n  color: var(--ink);\n  box-shadow: var(--shadow-sm);\n  text-decoration: none;\n  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease),\n    background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease);\n}\n.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }\n.btn:active { transform: translateY(0); box-shadow: var(--shadow-sm); }\n.btn-primary { background: var(--color-accent-700); color: var(--cream); border-color: var(--color-accent-700); }\n.btn-primary:hover { background: var(--color-accent-600); border-color: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-800); }\n.nav a.btn { font-size: 15px; }\n.nav a.btn-primary { color: var(--cream); }\n.nav a.btn-secondary { color: var(--color-accent-800); }\n.btn-secondary {\n  background: transparent;\n  color: var(--color-accent-800);\n  border-color: var(--color-accent-400);\n  box-shadow: none;\n}\n.btn-secondary:hover { background: var(--color-accent-100); border-color: var(--color-accent-500); box-shadow: var(--shadow-sm); }\n.btn-block { justify-content: center; text-align: center; }\n\n/* — schede — */\n.card {\n  background: var(--cream);\n  border: 1px solid var(--color-divider);\n  border-radius: var(--radius-md);\n  padding: 26px;\n  gap: 10px;\n  box-shadow: var(--shadow-sm);\n  transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), border-color 0.35s var(--ease);\n}\na.card { text-decoration: none; background-image: none; }\na.card:hover {\n  transform: translateY(-4px);\n  box-shadow: var(--shadow-md);\n  border-color: var(--color-accent-300);\n}\na.card:hover .card-meta { color: var(--color-accent-700); }\n.card-kicker {\n  align-self: flex-start;\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--color-accent-700);\n  background: none;\n  border: 0;\n  padding: 0;\n}\n.card-title {\n  font-family: var(--font-heading);\n  font-weight: 500;\n  font-size: 23px;\n  line-height: 1.2;\n  color: var(--ink);\n}\n.card-body { font-size: 15.5px; line-height: 1.65; color: var(--color-neutral-800); }\n.card-meta {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 12px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--color-neutral-600);\n  transition: color 0.3s var(--ease);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — etichette — */\n.tag {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  border: 1px solid transparent;\n  border-radius: 999px;\n  padding: 5px 12px;\n  color: var(--color-accent-800);\n}\n.tag-accent { background: var(--color-accent-200); }\n.tag-accent-2 { background: var(--color-accent-2-200); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-300); color: var(--color-neutral-800); }\n.tag-outline { background: transparent; border-color: var(--color-divider); color: var(--color-neutral-800); }\n\n/* — tabelle — */\n.table {\n  border-collapse: separate;\n  border-spacing: 0;\n  background: var(--cream);\n  border: 1px solid var(--color-divider);\n  border-radius: var(--radius-md);\n  overflow: hidden;\n  box-shadow: var(--shadow-sm);\n  font-size: 15px;\n}\n.table th {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: 12px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  background: var(--color-accent-100);\n  border-bottom: 1px solid var(--color-divider);\n  padding: 14px 20px;\n  text-align: left;\n  color: var(--color-accent-800);\n}\n.table td { border-top: 1px solid var(--color-divider); padding: 15px 20px; }\n.table tr:first-child td { border-top: 0; }\n\n/* — immagini — */\n.grayscale {\n  filter: none;\n  border: 0;\n  border-radius: var(--radius-lg);\n  overflow: hidden;\n  box-shadow: var(--shadow-md);\n  background: var(--color-neutral-300);\n}\n.grayscale image-slot {\n  display: block;\n  width: 100%;\n  height: 100%;\n  transition: transform 1.2s var(--ease);\n}\n.grayscale:hover image-slot { transform: scale(1.03); }\n\n/* — campi — */\n.input {\n  border: 1px solid var(--color-divider);\n  border-radius: var(--radius-sm);\n  background: var(--cream);\n  padding: 12px 16px;\n  font-family: var(--font-body);\n  transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);\n}\n.input:focus { border-color: var(--color-accent-500); box-shadow: 0 0 0 3px var(--color-accent-100); }\n<\u002Fstyle>\n<script src=\"6ec46cdb-d701-4405-bed6-8a0624251944\"><\u002Fscript>\n<script src=\"4789551a-404d-44e3-aa31-4238b203398d\"><\u002Fscript>\n<style>\nhtml { scroll-behavior: smooth; }\nbody { margin: 0; text-wrap: pretty; background: var(--color-bg); }\na:hover { color: var(--color-accent-700); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"--edge:clamp(20px,5vw,64px);--leading:28px;--measure:60ch;background:var(--color-bg);color:var(--color-text)\">\n\n  <nav class=\"nav\" style=\"padding:var(--space-3) var(--edge);gap:var(--space-6);flex-wrap:wrap;position:sticky;top:0;background:var(--color-bg);z-index:20\">\n    <a class=\"nav-brand\" href=\"Luigia%20Atorino%20-%20Home.html\" style=\"display:flex;align-items:center;text-decoration:none\">\n      <img class=\"brand-logo\" src=\"28f15321-8d92-4795-a523-ae804d43cde8\" alt=\"Luigia Atorino — Biologa Nutrizionista\">\n    <\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:var(--space-6);flex-wrap:wrap\">\n      <a href=\"Luigia%20Atorino%20-%20Chi%20sono.html\">Chi sono<\u002Fa>\n      <a href=\"Luigia%20Atorino%20-%20La%20visita.html\">La visita<\u002Fa>\n      <a href=\"Luigia%20Atorino%20-%20Attivita.html\">Attività<\u002Fa>\n      <a href=\"Luigia%20Atorino%20-%20Approfondimenti.html\">Approfondimenti<\u002Fa>\n      <a href=\"Luigia%20Atorino%20-%20Contatti.html\">Contatti<\u002Fa>\n      <a class=\"btn btn-primary\" href=\"Luigia%20Atorino%20-%20Contatti.html#prenota\">Prenota una visita<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  \n\n  <header data-reveal=\"\" style=\"padding:calc(2.5*var(--leading)) var(--edge) calc(2*var(--leading));display:grid;grid-template-columns:minmax(0,1.35fr) minmax(240px,0.85fr);gap:calc(1.5*var(--leading)) clamp(28px,5vw,72px);align-items:end\">\n    <div>\n      <h1 style=\"font-size:clamp(38px,5.6vw,72px);line-height:1.06;letter-spacing:-0.012em;margin:0\">Prima di dirti cosa mangiare, misuro com'è fatto il tuo corpo.<\u002Fh1>\n      <p style=\"font-size:18px;line-height:var(--leading);max-width:var(--measure);margin:calc(1.2*var(--leading)) 0 0\">Lascia che ti aiuti a migliorare le tue abitudini alimentari e a sentirti in forma, tutti i giorni, senza rinunciare al gusto.<\u002Fp>\n      <div style=\"display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--leading)\">\n        <a class=\"btn btn-primary\" href=\"Luigia%20Atorino%20-%20Contatti.html#prenota\">Prenota una visita<\u002Fa>\n        <a class=\"btn btn-secondary\" href=\"Luigia%20Atorino%20-%20La%20visita.html\">Come funziona una visita<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grayscale\" style=\"position:relative;width:100%;max-width:408px;aspect-ratio:3/4;height:auto\">\n      \n    <image-slot id=\"home-ritratto\" shape=\"rect\" fit=\"cover\" placeholder=\"Ritratto della dottoressa\" style=\"width:100%;height:100%\" src=\"19ead879-cc96-434f-8d0d-25f3b41725ae\"><\u002Fimage-slot><\u002Fdiv>\n  <\u002Fheader><hr class=\"hr\" style=\"margin:0 var(--edge)\">\n\n  <section data-reveal=\"\" style=\"padding:calc(1.5*var(--leading)) var(--edge)\">\n    <div data-stagger=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--leading) clamp(24px,4vw,64px)\">\n      <div>\n        <p style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(32px,3.2vw,46px);line-height:1.1;color:var(--color-accent-700);margin:0\">3<\u002Fp>\n        <p style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-800);margin:var(--space-2) 0 0\">Metodi di analisi della composizione corporea<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(32px,3.2vw,46px);line-height:1.1;color:var(--color-accent-700);margin:0\">2<\u002Fp>\n        <p style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-800);margin:var(--space-2) 0 0\">Studi: Milano e Trezzano sul Naviglio<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(32px,3.2vw,46px);line-height:1.1;color:var(--color-accent-700);margin:0\">60<\u002Fp>\n        <p style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-800);margin:var(--space-2) 0 0\">Recensioni verificate su MioDottore<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(32px,3.2vw,46px);line-height:1.1;color:var(--color-accent-700);margin:0\">Online<\u002Fp>\n        <p style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-800);margin:var(--space-2) 0 0\">Consulenza online, da qualsiasi città<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"hr\" style=\"margin:0 var(--edge)\">\n\n  <section data-reveal=\"\" style=\"padding:calc(2*var(--leading)) var(--edge)\">\n    <p style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 var(--space-4)\">Gli strumenti<\u002Fp>\n    <h2 style=\"font-size:clamp(28px,3.4vw,40px);max-width:24ch;margin:0 0 var(--leading)\">Tre modi di leggere la composizione corporea. In studio li uso tutti.<\u002Fh2>\n    <div data-stagger=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-4)\">\n      <div class=\"card\">\n        <p class=\"card-kicker\">01<\u002Fp>\n        <p class=\"card-title\">Bioimpedenzometria<\u002Fp>\n        <p class=\"card-body\">Una corrente impercettibile attraversa il corpo e misura quanta acqua contiene e come è distribuita. Da qui si ricavano massa grassa, massa magra e stato di idratazione.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <p class=\"card-kicker\">02<\u002Fp>\n        <p class=\"card-title\">Pletismografia a Immagine Digitale<\u002Fp>\n        <p class=\"card-body\">Una scansione ottica ricostruisce il volume del corpo senza contatto. Utile per fotografare la situazione di partenza e confrontarla nel tempo.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <p class=\"card-kicker\">03<\u002Fp>\n        <p class=\"card-title\">Plicometria<\u002Fp>\n        <p class=\"card-body\">Un calibro misura lo spessore delle pliche cutanee in punti precisi del corpo: la stima più diretta del grasso sottocutaneo e di dove si deposita.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:17px;line-height:var(--leading);max-width:var(--measure);margin:var(--leading) 0 0\">Ogni metodica presenta vantaggi e limiti, e la scelta dipende dalle esigenze del singolo paziente. <a href=\"Luigia%20Atorino%20-%20La%20visita.html#strumenti\">Vedi come funzionano<\u002Fa><\u002Fp>\n  <\u002Fsection>\n\n  <hr class=\"hr\" style=\"margin:0 var(--edge)\">\n\n  <section data-reveal=\"\" style=\"padding:calc(2*var(--leading)) var(--edge)\">\n    <p style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 var(--space-4)\">Cosa posso fare per te<\u002Fp>\n    <div data-stagger=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:0 clamp(20px,3vw,56px)\">\n      <div style=\"border-top:1px solid var(--color-divider);padding:var(--space-4) 0 var(--leading)\">\n        <p style=\"font-family:var(--font-heading);font-weight:600;font-size:15px;margin:0 0 var(--space-3)\">01<\u002Fp>\n        <p style=\"font-size:17px;line-height:var(--leading);margin:0\">Valutare il tuo stato nutrizionale e la tua composizione corporea<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--color-divider);padding:var(--space-4) 0 var(--leading)\">\n        <p style=\"font-family:var(--font-heading);font-weight:600;font-size:15px;margin:0 0 var(--space-3)\">02<\u002Fp>\n        <p style=\"font-size:17px;line-height:var(--leading);margin:0\">Condividere obiettivi nutrizionali e ponderali<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--color-divider);padding:var(--space-4) 0 var(--leading)\">\n        <p style=\"font-family:var(--font-heading);font-weight:600;font-size:15px;margin:0 0 var(--space-3)\">03<\u002Fp>\n        <p style=\"font-size:17px;line-height:var(--leading);margin:0\">Elaborare un piano alimentare personalizzato<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--color-divider);padding:var(--space-4) 0 var(--leading)\">\n        <p style=\"font-family:var(--font-heading);font-weight:600;font-size:15px;margin:0 0 var(--space-3)\">04<\u002Fp>\n        <p style=\"font-size:17px;line-height:var(--leading);margin:0\">Controllare periodicamente i risultati per eventuali modifiche del piano alimentare<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ mostraFoto }}\" hint-placeholder-val=\"{{ true }}\">\n    <section data-reveal=\"\" style=\"padding:0 var(--edge) calc(2*var(--leading))\">\n      <figure class=\"grayscale\" style=\"position:relative;width:100%;aspect-ratio:21/9\">\n        <image-slot id=\"home-studio\" shape=\"rect\" fit=\"cover\" placeholder=\"Lo studio: sala visita o strumentazione\"><\u002Fimage-slot>\n        <figcaption style=\"position:absolute;top:100%;font-size:11px;color:var(--color-neutral-700);margin-top:var(--space-2)\">Studio Privato — Via Privata Valentino Pasini, 21, Milano<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ mostraRecensioni }}\" hint-placeholder-val=\"{{ true }}\">\n    <section data-reveal=\"\" style=\"border-top:1px solid var(--color-divider);padding:calc(2*var(--leading)) var(--edge)\">\n      <p style=\"font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 var(--leading)\">Dai pazienti<\u002Fp>\n      <div data-stagger=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--leading) clamp(24px,4vw,64px)\">\n        <blockquote style=\"margin:0\">\n          <p style=\"font-size:17px;line-height:var(--leading);margin:0 0 var(--space-3)\">“Dottoressa molto competente che si avvale di tecniche multiple e molto aggiornate. Approccio “globale” sull'analisi del corpo e del Metabolismo e non solo su alimentazione.”<\u002Fp>\n          <p style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);margin:0\">Silvia — prima visita<\u002Fp>\n        <\u002Fblockquote>\n        <blockquote style=\"margin:0\">\n          <p style=\"font-size:17px;line-height:var(--leading);margin:0 0 var(--space-3)\">“Ho apprezzato il percorso nutrizionale personalizzato, le spiegazioni chiare e dettagliate e la grande capacità d'ascolto.”<\u002Fp>\n          <p style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);margin:0\">L.A. — prima visita<\u002Fp>\n        <\u002Fblockquote>\n        <blockquote style=\"margin:0\">\n          <p style=\"font-size:17px;line-height:var(--leading);margin:0 0 var(--space-3)\">“Accogliente e dotata di strumentazione all'avanguardia per l'analisi corporea che aiuta molto la motivazione con il monitoraggio dei progressi.”<\u002Fp>\n          <p style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);margin:0\">Paziente — MioDottore<\u002Fp>\n        <\u002Fblockquote>\n      <\u002Fdiv>\n      <p style=\"margin:var(--leading) 0 0\"><a href=\"https://www.miodottore.it/profilo/luigia-atorino\" target=\"_blank\" rel=\"noopener\">Leggi tutte le 60 recensioni su MioDottore<\u002Fa><\u002Fp>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section data-reveal=\"\" style=\"background:var(--color-accent-700);color:#fbf8f0;padding:calc(2.5*var(--leading)) var(--edge)\">\n    <h2 style=\"font-size:clamp(34px,5vw,64px);line-height:1.06;letter-spacing:-0.012em;max-width:22ch;margin:0\">Vuoi prendere un appuntamento?<\u002Fh2>\n    <p style=\"font-size:25px;line-height:1.35;max-width:34ch;margin:var(--leading) 0 0\">In studio a Milano e a Trezzano sul Naviglio, opp
